<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hamburgueria{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #fff8ee; }
    .navbar-burger { background: #b8470a; }
    .btn-burger { background: #e8741e; border-color: #e8741e; color: #fff; }
    .btn-burger:hover { background: #c9610f; border-color: #c9610f; color: #fff; }
    .card { border: 0; box-shadow: 0 2px 10px rgba(0, 0, 0, .08); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark navbar-burger mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'hamburguer_list' %}">🍔 Hamburgueria</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <span class="text-white me-2">Olá, {{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
          </form>
        {% else %}
          <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Entrar</a>
          <a class="btn btn-sm btn-light" href="{% url 'cadastro' %}">Criar conta</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
