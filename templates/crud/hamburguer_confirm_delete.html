{% extends "base.html" %}

{% block title %}Excluir · Hamburgueria{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body p-4 text-center">
        <h3 class="mb-3">Excluir hambúrguer</h3>
        <p>Tem certeza que deseja excluir <strong>{{ object.nome }}</strong>?</p>
        <form method="post" class="d-flex justify-content-center gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sim, excluir</button>
          <a href="{% url 'hamburguer_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
