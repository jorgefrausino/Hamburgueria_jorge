{% extends "base.html" %}

{% block title %}{{ titulo }} · Hamburgueria{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="mb-4">{{ titulo }}</h3>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            {% include "includes/campo.html" with campo=field %}
          {% endfor %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-burger">Salvar</button>
            <a href="{% url 'hamburguer_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
